[workspace]
resolver = "2"
members = [
    "crates/genoma-core",
    "crates/pi-engine",
    "crates/feature-engine",
    "crates/dna-engine",
    "crates/analysis-engine",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["GENOMA contributors"]
description = "GENOMA — experimental structural fingerprinting and visualization of digital data"
repository = "https://github.com/genoma-project/genoma"
readme = "README.md"

[workspace.dependencies]
genoma-core = { path = "crates/genoma-core" }
pi-engine = { path = "crates/pi-engine" }
feature-engine = { path = "crates/feature-engine" }
dna-engine = { path = "crates/dna-engine" }
analysis-engine = { path = "crates/analysis-engine" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rayon = "1"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
