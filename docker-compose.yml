services:
  postgres:
    image: postgres:16-alpine
    container_name: genoma-postgres
    environment:
      POSTGRES_USER: genoma
      POSTGRES_PASSWORD: genoma
      POSTGRES_DB: genoma
    ports:
      - "5432:5432"
    volumes:
      - genoma-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genoma -d genoma"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: genoma-redis
    ports:
      - "6379:6379"
    volumes:
      - genoma-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: genoma-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: genoma
      MINIO_ROOT_PASSWORD: genoma-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - genoma-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    container_name: genoma-minio-init
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 genoma genoma-secret &&
      mc mb --ignore-existing local/genoma &&
      mc anonymous set none local/genoma &&
      echo 'MinIO bucket ready'
      "

volumes:
  genoma-pg:
  genoma-redis:
  genoma-minio:
